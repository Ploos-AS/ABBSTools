name: FS-UAE AROS qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aros-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          while IFS= read -r source; do
            sudo mv "$source" "$source.disabled"
          done < <(grep -RIl 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip

      - name: Gate 0 - fetch shared AROS system image
        timeout-minutes: 8
        run: bash ci/fs-uae/fetch-aros-system.sh build/fs-uae/aros-system

      - name: Gate 1 - native 68000 build
        timeout-minutes: 5
        run: bash ci/build-native.sh

      - name: Gate 2 - execute RexxPorts inside AROS guest
        timeout-minutes: 8
        run: bash ci/fs-uae/run-aros-rexxports-smoke.sh

      - name: Gate 3 - execute RexxProbe inside AROS guest
        timeout-minutes: 8
        run: bash ci/fs-uae/run-aros-rexxprobe-smoke.sh

      - name: Gate 4 - execute NodeInfo session fixtures inside AROS guest
        timeout-minutes: 8
        run: bash ci/fs-uae/run-aros-nodeinfo-session-smoke.sh

      - name: Gate 5 - execute NodeWatch polling inside AROS guest
        timeout-minutes: 8
        run: bash ci/fs-uae/run-aros-nodewatch-smoke.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-uae-aros-m2-1-qualification
          path: |
            build/qualification/native/RexxPorts
            build/qualification/native/RexxProbe
            build/qualification/native/NodeInfo
            build/qualification/native/NodeWatch
            build/qualification/native/NodeWatchTrace
            build/qualification/native/result.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-rexxports/result.txt
            build/fs-uae/aros-rexxports/fs-uae.log
            build/fs-uae/aros-rexxports/fs-uae-version.txt
            build/fs-uae/aros-rexxports/aros-guest.fs-uae
            build/fs-uae/aros-rexxprobe/result.txt
            build/fs-uae/aros-rexxprobe/fs-uae.log
            build/fs-uae/aros-rexxprobe/fs-uae-version.txt
            build/fs-uae/aros-rexxprobe/aros-guest.fs-uae
            build/fs-uae/aros-nodeinfo-session/result.txt
            build/fs-uae/aros-nodeinfo-session/fs-uae.log
            build/fs-uae/aros-nodeinfo-session/fs-uae-version.txt
            build/fs-uae/aros-nodeinfo-session/aros-guest.fs-uae
            build/fs-uae/aros-nodewatch/result.txt
            build/fs-uae/aros-nodewatch/fs-uae.log
            build/fs-uae/aros-nodewatch/fs-uae-version.txt
            build/fs-uae/aros-nodewatch/aros-guest.fs-uae
          if-no-files-found: warn
