name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m68k-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Native 68000 build gate
        run: bash ci/build-native.sh

      - name: Upload native qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-2-native-qualification
          path: |
            build/qualification/native/RexxPorts
            build/qualification/native/RexxProbe
            build/qualification/native/file.txt
            build/qualification/native/checksums.sha256
            build/qualification/native/compiler-version.txt
            build/qualification/native/toolchain-image.txt
            build/qualification/native/result.txt
          if-no-files-found: warn
